<h2>Default Theme Mode</h2>
<p class="subtitle">App will have both dark and light mode with a toggle. Which should be the default?</p>

<div class="split">
  <div class="mockup" data-choice="dark-default" onclick="toggleSelect(this)" style="cursor:pointer;">
    <div class="mockup-header">Dark Mode Default</div>
    <div class="mockup-body" style="padding:0;">
      <div style="display:flex;height:200px;">
        <div style="width:140px;background-color:#292524;padding:12px;border-right:1px solid #44403c;">
          <div style="height:12px;width:60%;background:#059669;border-radius:3px;margin-bottom:16px;"></div>
          <div style="height:8px;width:80%;background:#78716c;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:65%;background:#44403c;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:70%;background:#44403c;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:55%;background:#44403c;border-radius:2px;"></div>
        </div>
        <div style="flex:1;background-color:#1c1917;padding:12px;">
          <div style="height:10px;width:30%;background:#fafaf9;border-radius:2px;margin-bottom:10px;"></div>
          <div style="background:#292524;border-radius:8px;padding:10px;margin-bottom:8px;">
            <div style="height:6px;width:50%;background:#d6d3d1;border-radius:2px;margin-bottom:6px;"></div>
            <div style="height:6px;width:80%;background:#78716c;border-radius:2px;"></div>
          </div>
          <div style="background:#292524;border-radius:8px;padding:10px;">
            <div style="height:6px;width:40%;background:#d6d3d1;border-radius:2px;margin-bottom:6px;"></div>
            <div style="height:6px;width:70%;background:#78716c;border-radius:2px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mockup" data-choice="light-default" onclick="toggleSelect(this)" style="cursor:pointer;">
    <div class="mockup-header">Light Mode Default</div>
    <div class="mockup-body" style="padding:0;">
      <div style="display:flex;height:200px;">
        <div style="width:140px;background-color:#f5f5f4;padding:12px;border-right:1px solid #d6d3d1;">
          <div style="height:12px;width:60%;background:#059669;border-radius:3px;margin-bottom:16px;"></div>
          <div style="height:8px;width:80%;background:#78716c;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:65%;background:#d6d3d1;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:70%;background:#d6d3d1;border-radius:2px;margin-bottom:10px;"></div>
          <div style="height:8px;width:55%;background:#d6d3d1;border-radius:2px;"></div>
        </div>
        <div style="flex:1;background-color:#fafaf9;padding:12px;">
          <div style="height:10px;width:30%;background:#1c1917;border-radius:2px;margin-bottom:10px;"></div>
          <div style="background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;padding:10px;margin-bottom:8px;">
            <div style="height:6px;width:50%;background:#44403c;border-radius:2px;margin-bottom:6px;"></div>
            <div style="height:6px;width:80%;background:#a8a29e;border-radius:2px;"></div>
          </div>
          <div style="background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;padding:10px;">
            <div style="height:6px;width:40%;background:#44403c;border-radius:2px;margin-bottom:6px;"></div>
            <div style="height:6px;width:70%;background:#a8a29e;border-radius:2px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top:16px;">Both modes will exist. This just sets which loads first. Click to pick.</p>
